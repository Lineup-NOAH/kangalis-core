services:
  db:
    image: postgres:16
    # Kimlik bilgileri: setup sihirbazı .env'e POSTGRES_USER/PASSWORD/DB yazarsa onlar; yoksa
    # yerel/lab varsayılanı (cyber/cyber/cybersectool). NOT: parola pgdata'ya İLK açılışta gömülür —
    # sonradan değiştirmek için 'pgdata' volume'unu sıfırlayın (docker compose down -v).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyber}
      POSTGRES_DB: ${POSTGRES_DB:-cybersectool}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyber} -d ${POSTGRES_DB:-cybersectool}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # Parola: setup sihirbazı REDIS_PASSWORD verirse auth açılır; boşsa (varsayılan) auth yok.
    # redis-server --requirepass "" = parola DEVRE DIŞI (yerel/lab varsayılanı). İstemciler
    # REDIS_URL üzerinden bağlanır (sihirbaz parolayı oraya da doğru biçimde gömer).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "6379:6379"

  # DB şema migrasyonu (tek-seferlik): app/worker/beat/mcp BAŞLAMADAN önce `alembic upgrade head`
  # çalışır ve çıkar — kullanıcı elle migration koşmaz (otomatik). İdempotent; her up'ta güvenli.
  migrate:
    build: .
    # Dağıtım B (çek-çalıştır): `docker compose pull` bu yayınlanmış imajı çeker (DERLEME yok).
    # Yayınlama TEK yol: GitHub Actions → 'Core imajı' (core-image.yml) workflow'u. 5 servis AYNI imaj.
    image: ${KANGALIS_IMAGE:-ghcr.io/lineup-noah/kangalis-core:latest}
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyber}:${POSTGRES_PASSWORD:-cyber}@db:5432/${POSTGRES_DB:-cybersectool}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    # Dağıtım B (çek-çalıştır): `docker compose pull` bu yayınlanmış imajı çeker (DERLEME yok).
    # Yayınlama TEK yol: GitHub Actions → 'Core imajı' (core-image.yml) workflow'u. 5 servis AYNI imaj.
    image: ${KANGALIS_IMAGE:-ghcr.io/lineup-noah/kangalis-core:latest}
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyber}:${POSTGRES_PASSWORD:-cyber}@db:5432/${POSTGRES_DB:-cybersectool}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Kimlik kasası Fernet anahtarı (boşsa SECRET_KEY'den türetilir — yalnız dev). Sihirbaz
      # güçlü rastgele üretir; app+worker AYNI değeri almalı ki worker'ın çözebildiğini app şifreleyebilsin.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      # NVD API anahtarı (opsiyonel; rate-limit'i yükseltir) + kritik-bulgu bildirim webhook'u.
      # Boşken zararsız (NVD anahtarsız çalışır / bildirim kapalı). .env'den gelir, container'a buradan ulaşır.
      NVD_API_KEY: ${NVD_API_KEY:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # Taramadan/envanterden dışlanacak ek IP'ler (aracın kendi altyapısı oto-algılanır).
      EXCLUDE_SCAN_IPS: ${EXCLUDE_SCAN_IPS:-}
      # Agresif (müdahaleci) tarama org-seviyesi kill-switch'i. Kod varsayılanı KAPALI
      # (güvenli prod); dev'de açık ki agresif iş akışı (yine 'kabul ediyorum' onayıyla)
      # kesintiye uğramasın. Üretimde devre dışı bırakmak için: ALLOW_AGGRESSIVE_SCANS=false
      ALLOW_AGGRESSIVE_SCANS: ${ALLOW_AGGRESSIVE_SCANS:-true}
      # YEREL AI (OpenAI-uyumlu) endpoint'i — app'in /ai/explain & /ai/summary route'ları buraya
      # bağlanır. 'ai' profili açıksa aşağıdaki ollama servisine işaret eder; sıfır egress.
      # Host'taki native motor (LM Studio vb.) için: http://host.docker.internal:<port>/v1.
      # Yalnız VARSAYILAN: gerçek açma/model/timeout Ayarlar > AI kartından (AppSettings) yönetilir.
      AI_ENDPOINT: ${AI_ENDPOINT:-http://ollama:11434/v1}
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      AI_TIMEOUT: ${AI_TIMEOUT:-300}
    volumes:
      # Sistem/Servisler paneli (admin) — konteyner durum + CPU/RAM/disk için Docker Engine
      # API'sine SALT-OKUMA erişim. Kod yalnız GET (list/stats/df) yapar; mount edilmezse
      # panel host disk/RAM'i yine gösterir, konteyner listesi için "soket yok" mesajı verir.
      # GÜVENLİK NOTU: docker.sock = Docker daemon erişimi; istemiyorsan bu satırı kaldır.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8000:8000"
    # YEREL AI host-native yolu (Companion installer / LM Studio / Ollama host'ta): app container'ı
    # host'a `host.docker.internal` ile ulaşır → AI_ENDPOINT=http://host.docker.internal:<port>/v1.
    # Docker Desktop (Win/Mac) bunu zaten sağlar; LINUX'ta host-gateway eşlemesi ŞARTtır (yoksa
    # host-native motor yolu sessizce bağlanamaz — en sık destek bileti). AI kapalıyken zararsız.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build: .
    # Dağıtım B (çek-çalıştır): `docker compose pull` bu yayınlanmış imajı çeker (DERLEME yok).
    # Yayınlama TEK yol: GitHub Actions → 'Core imajı' (core-image.yml) workflow'u. 5 servis AYNI imaj.
    image: ${KANGALIS_IMAGE:-ghcr.io/lineup-noah/kangalis-core:latest}
    command: celery -A cybersectool.tasks.celery_app worker --loglevel=info
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyber}:${POSTGRES_PASSWORD:-cyber}@db:5432/${POSTGRES_DB:-cybersectool}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Kimlik kasası Fernet anahtarı — app ile AYNI olmalı (kimlikli taramada parolayı çözer).
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      # NVD oto-senkron worker'da koşar (anahtar rate-limit'i yükseltir); kritik-bulgu bildirimi de.
      NVD_API_KEY: ${NVD_API_KEY:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # Tarama worker'ı: aracın kendi container IP'lerini + bu listeyi taramadan dışlar.
      EXCLUDE_SCAN_IPS: ${EXCLUDE_SCAN_IPS:-}
      # Agresif kill-switch (app ile AYNI olmalı): worker derinlemesine savunma için de okur.
      ALLOW_AGGRESSIVE_SCANS: ${ALLOW_AGGRESSIVE_SCANS:-true}
      # YEREL AI (OpenAI-uyumlu) — worker da Faz 2 exploit-hazırlama için aynı motoru kullanacak
      # (app ile AYNI endpoint). Boş/erişilemezse her şey graceful (statik akış sürer).
      AI_ENDPOINT: ${AI_ENDPOINT:-http://ollama:11434/v1}
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      AI_TIMEOUT: ${AI_TIMEOUT:-300}
    # YEREL AI host-native yolu (worker Faz 2 exploit-hazırlamada aynı motoru kullanacak); app ile
    # AYNI gerekçe — LINUX'ta host.docker.internal çözümü için host-gateway eşlemesi şart.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  beat:
    build: .
    # Dağıtım B (çek-çalıştır): `docker compose pull` bu yayınlanmış imajı çeker (DERLEME yok).
    # Yayınlama TEK yol: GitHub Actions → 'Core imajı' (core-image.yml) workflow'u. 5 servis AYNI imaj.
    image: ${KANGALIS_IMAGE:-ghcr.io/lineup-noah/kangalis-core:latest}
    command: celery -A cybersectool.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyber}:${POSTGRES_PASSWORD:-cyber}@db:5432/${POSTGRES_DB:-cybersectool}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # beat yalnız zamanlar (kasayı çözmez); yine de app/worker ile AYNI anahtarları taşısın ki
      # ileride bir görev kasaya dokunursa default kurulumda aynı Fernet anahtarı türesin.
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  mcp:
    build: .
    # Dağıtım B (çek-çalıştır): `docker compose pull` bu yayınlanmış imajı çeker (DERLEME yok).
    # Yayınlama TEK yol: GitHub Actions → 'Core imajı' (core-image.yml) workflow'u. 5 servis AYNI imaj.
    image: ${KANGALIS_IMAGE:-ghcr.io/lineup-noah/kangalis-core:latest}
    command: python -m cybersectool.mcp.server
    environment:
      MCP_TRANSPORT: http
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyber}:${POSTGRES_PASSWORD:-cyber}@db:5432/${POSTGRES_DB:-cybersectool}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # mcp kasayı çözmez (yalnız token-hash + parola doğrular); app/worker ile AYNI anahtarları
      # taşısın ki tutarlılık bozulmasın ve ileride kasaya dokunan bir yol eklenirse anahtar tutsun.
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # YEREL AI (Ollama, OpenAI-uyumlu /v1) — Kangalis'in on-prem AI asistanı (zafiyet açıklama + rapor
  # özeti; Faz 2'de exploit hazırlama). VARSAYILAN KAPALI: yalnız 'ai' profiliyle başlar
  # (`docker compose --profile ai up -d ollama`). CPU'da koşar (GPU gerekmez). SIFIR EGRESS — port
  # host'a publish EDİLMEZ (yalnız internal ağ), istemci verisi müşteri ağından çıkmaz.
  # OpenAI ``/v1/chat/completions`` sunar → app/worker AI_ENDPOINT=http://ollama:11434/v1.
  # MODEL: bu servis modeli OTOMATİK çekmez; ilk açılıştan sonra bir kez çekin (volume'da kalıcı):
  #   docker compose exec ollama ollama pull qwen3:8b
  # AIR-GAP / SIFIR İNDİRME (önerilen): modeli GÖMÜLÜ taşıyan ön-paketli imaj → pull gerekmez:
  #   docker-compose.ai-baked.yml override + Dockerfile.ai (make ai-baked).
  # PERFORMANS (#273): grounded rapor üretimi CPU'da yavaştır (özet/script ~3-5 dk sıcak modelle);
  # bu yüzden ai_timeout (Ayarlar) cömert tutulur. OLLAMA_KEEP_ALIVE=-1 → model boşalmaz,
  # soğuk-yükleme cezası (~70sn) olmaz.
  ollama:
    # Digest-pin (tedarik-zinciri sertleştirme): mutable ":latest" sessizce değişebilir → Ollama
    # 0.30.8 digest'ine sabitlendi. Güncellemek için:
    #   docker pull ollama/ollama:latest && docker inspect ollama/ollama:latest --format '{{index .RepoDigests 0}}'
    image: ollama/ollama@sha256:05b6fe5143ed006d6d4abd39bdd575f962a5822bdf81e6fbb5e6894eb984ab9c
    profiles: ["ai"]
    # Sabit konteyner adı: hem ağ-içi DNS (app/worker 'ollama' VE 'kangalis-ai' ile çözer → elle
    # kurulmuş eski http://kangalis-ai:11434 ayarı bozulmaz) hem de `docker exec/restart/network
    # kangalis-ai ...` komutlarının çalışması için (network alias yalnız DNS verir, CLI adresi vermez).
    container_name: kangalis-ai
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      # CPU'da KV-cache şişmesini sınırla: tek paralel slot (eşzamanlı app+worker isteklerinde her
      # slot ayrı KV cache açar; tek slot mem_limit'e sığmayı kolaylaştırır).
      OLLAMA_NUM_PARALLEL: "1"
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    # qwen3:8b ~5-6 GB + KV cache + runtime. Düşük-RAM'de AI_MEM_LIMIT ile küçültün (ör. 6g).
    mem_limit: ${AI_MEM_LIMIT:-8g}
    restart: unless-stopped
    healthcheck:
      # Ollama API'si ayağa kalkınca `ollama list` 0 döner (model olmasa da). Bu yalnız
      # BİLGİLENDİRİCİDİR: app/worker AI'a depends_on ile BAĞLANMAZ (graceful degradation) → motor
      # yükselirken/kapalıyken uygulama her zaman ayağa kalkar; yalnız Ayarlar sağlık rozeti + ps gösterir.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  ollama_models:

# Köprü ağ subnet'i yapılandırılabilir (VI-7): müşteri LAN'ı ile çakışmayı önlemek için
# .env'de DOCKER_SUBNET ayarlayın (ör. 10.89.0.0/16). Varsayılan alışılmadık bir aralık.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}
