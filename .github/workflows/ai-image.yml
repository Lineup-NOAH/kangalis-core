name: AI imajı (ön-paketli model)

# Qwen3-8B modeli GÖMÜLÜ olan kendi Ollama AI imajımızı (kangalis-ai) derler + ghcr'a basar.
# Model build sırasında `ollama pull` ile çekilip imaja gömülür → kullanıcı sonra yalnız bu hazır
# imajı çeker (çalışma anında sıfır indirme). ELLE tetiklenir (büyük/pahalı; her push'ta koşmaz).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "İmaj etiketi (ghcr.io/<owner>/kangalis-ai:<tag>)"
        default: "qwen3-8b"
        required: true
      model:
        description: "Gömülecek Ollama modeli (etiket)"
        default: "qwen3:8b"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 5 GB+ model + imaj katmanları için disk aç (hosted runner'da ~14 GB boş gelir).
      - name: Disk alanı aç
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      # ghcr imaj referansları küçük-harf olmalı; owner'ı (ör. Lineup-NOAH) küçült.
      - name: Sahip adını küçük harfe çevir
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: ghcr girişi
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derle + push (model gömülü)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ai
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/kangalis-ai:${{ github.event.inputs.tag }}
          build-args: |
            AI_MODEL=${{ github.event.inputs.model }}
