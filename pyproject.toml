[project]
name = "cybersectool"
version = "1.2.0"
description = "Kangalis — Lineup-NOAH ic ag zafiyet tarama platformu"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lineup-NOAH" }]
dependencies = [
    "aiomysql>=0.2.0",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "asyncssh>=2.23.0",
    "celery[redis]>=5.6.3",
    "cryptography>=44.0.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "impacket>=0.11.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "ldap3>=2.9.1",
    "mcp>=1.27.2",
    "oracledb>=2.0.0",
    "pydantic-settings>=2.14.1",
    "pyotp>=2.9.0",
    "pysnmp>=7.1.0",
    "python-libnmap>=0.7.3",
    "python-multipart>=0.0.31",
    "python-tds>=1.15.0",
    "pywinrm>=0.5.0",
    "qrcode>=7.4.2",
    "sqlalchemy[asyncio]>=2.0.50",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.49.0",
    "weasyprint>=60",
]

[project.scripts]
cybersectool-mcp = "cybersectool.mcp.server:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "httpx>=0.28.1",
  "aiosqlite>=0.22.1",
  "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybersectool"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "libnmap.*",
    "weasyprint.*",
    "winrm.*",
    "ldap3.*",
    "qrcode.*",
    "asyncpg.*",
    "aiomysql.*",
    "pytds.*",
    "oracledb.*",
    "pysnmp.*",
    "impacket.*",
    "cybersectool.exploit.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cybersectool.tasks.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["cybersectool.mcp.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "disclaimer_gate: sorumluluk reddi kapısını gerçek haliyle sınar (conftest bypass'ını atlar)",
]
