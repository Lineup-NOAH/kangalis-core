<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sev-critical:#EF4444;--sev-high:#F97316;--sev-medium:#F59E0B;--sev-low:#3B82F6;--sev-info:#64748B;}
[data-theme=dark]{--bg:#0b0f14;--bg2:#11161d;--card:#161c25;--border:#232b36;--fg:#e6edf3;--fg2:#9aa7b4;--accent:#E0A458;--accent-weak:rgba(224,164,88,.14);--accent-line:rgba(224,164,88,.4);--steel:#3B82F6;--sh-sm:0 1px 2px rgba(0,0,0,.4);--sh-md:0 8px 24px rgba(0,0,0,.45);--danger-bg:rgba(239,68,68,.1);--danger-line:rgba(239,68,68,.45);}
[data-theme=light]{--bg:#f6f8fa;--bg2:#eef1f5;--card:#fff;--border:#e3e8ee;--fg:#0b0f14;--fg2:#5b6671;--accent:#BC7A2C;--accent-weak:rgba(188,122,44,.12);--accent-line:rgba(188,122,44,.38);--steel:#2563EB;--sh-sm:0 1px 2px rgba(16,24,40,.06);--sh-md:0 8px 24px rgba(16,24,40,.1);--danger-bg:rgba(239,68,68,.07);--danger-line:rgba(239,68,68,.4);}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:20px;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-sm)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
.dot{width:6px;height:6px;border-radius:99px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;border:1px solid transparent;cursor:default}
svg{display:block}
</style></head><body><div class="lbl" style="margin-bottom:12px">Severity · constant across themes</div>
<div class="row" style="gap:10px;margin-bottom:14px">
<div class="col" style="gap:6px"><div style="width:118px;height:46px;border-radius:8px;background:var(--sev-critical)"></div><div class="mono" style="font-size:11px;color:var(--fg2)">Critical · #EF4444</div></div><div class="col" style="gap:6px"><div style="width:118px;height:46px;border-radius:8px;background:var(--sev-high)"></div><div class="mono" style="font-size:11px;color:var(--fg2)">High · #F97316</div></div><div class="col" style="gap:6px"><div style="width:118px;height:46px;border-radius:8px;background:var(--sev-medium)"></div><div class="mono" style="font-size:11px;color:var(--fg2)">Medium · #F59E0B</div></div><div class="col" style="gap:6px"><div style="width:118px;height:46px;border-radius:8px;background:var(--sev-low)"></div><div class="mono" style="font-size:11px;color:var(--fg2)">Low · #3B82F6</div></div><div class="col" style="gap:6px"><div style="width:118px;height:46px;border-radius:8px;background:var(--sev-info)"></div><div class="mono" style="font-size:11px;color:var(--fg2)">Info · #64748B</div></div>
</div><div class="row">
<span class="badge" style="color:var(--sev-critical);background:color-mix(in srgb,var(--sev-critical) 13%,transparent);border:1px solid color-mix(in srgb,var(--sev-critical) 30%,transparent)"><span class="dot" style="background:var(--sev-critical)"></span>Critical</span><span class="badge" style="color:var(--sev-high);background:color-mix(in srgb,var(--sev-high) 13%,transparent);border:1px solid color-mix(in srgb,var(--sev-high) 30%,transparent)"><span class="dot" style="background:var(--sev-high)"></span>High</span><span class="badge" style="color:var(--sev-medium);background:color-mix(in srgb,var(--sev-medium) 13%,transparent);border:1px solid color-mix(in srgb,var(--sev-medium) 30%,transparent)"><span class="dot" style="background:var(--sev-medium)"></span>Medium</span><span class="badge" style="color:var(--sev-low);background:color-mix(in srgb,var(--sev-low) 13%,transparent);border:1px solid color-mix(in srgb,var(--sev-low) 30%,transparent)"><span class="dot" style="background:var(--sev-low)"></span>Low</span><span class="badge" style="color:var(--sev-info);background:color-mix(in srgb,var(--sev-info) 13%,transparent);border:1px solid color-mix(in srgb,var(--sev-info) 30%,transparent)"><span class="dot" style="background:var(--sev-info)"></span>Info</span>
</div></body></html>
