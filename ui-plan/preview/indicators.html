<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sev-critical:#EF4444;--sev-high:#F97316;--sev-medium:#F59E0B;--sev-low:#3B82F6;--sev-info:#64748B;}
[data-theme=dark]{--bg:#0b0f14;--bg2:#11161d;--card:#161c25;--border:#232b36;--fg:#e6edf3;--fg2:#9aa7b4;--accent:#E0A458;--accent-weak:rgba(224,164,88,.14);--accent-line:rgba(224,164,88,.4);--steel:#3B82F6;--sh-sm:0 1px 2px rgba(0,0,0,.4);--sh-md:0 8px 24px rgba(0,0,0,.45);--danger-bg:rgba(239,68,68,.1);--danger-line:rgba(239,68,68,.45);}
[data-theme=light]{--bg:#f6f8fa;--bg2:#eef1f5;--card:#fff;--border:#e3e8ee;--fg:#0b0f14;--fg2:#5b6671;--accent:#BC7A2C;--accent-weak:rgba(188,122,44,.12);--accent-line:rgba(188,122,44,.38);--steel:#2563EB;--sh-sm:0 1px 2px rgba(16,24,40,.06);--sh-md:0 8px 24px rgba(16,24,40,.1);--danger-bg:rgba(239,68,68,.07);--danger-line:rgba(239,68,68,.4);}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:20px;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-sm)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
.dot{width:6px;height:6px;border-radius:99px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;border:1px solid transparent;cursor:default}
svg{display:block}
</style></head><body><div class="lbl" style="margin-bottom:12px">Source badges · KEV · EPSS · CVSS</div>
<div class="row" style="gap:10px;margin-bottom:14px">
<span class="badge mono" style="color:#3B82F6;background:color-mix(in srgb,#3B82F6 12%,transparent);border:1px solid color-mix(in srgb,#3B82F6 28%,transparent);font-size:11px"><span style="width:6px;height:6px;border-radius:2px;background:#3B82F6"></span>NVD</span><span class="badge mono" style="color:#E0A458;background:color-mix(in srgb,#E0A458 12%,transparent);border:1px solid color-mix(in srgb,#E0A458 28%,transparent);font-size:11px"><span style="width:6px;height:6px;border-radius:2px;background:#E0A458"></span>Exploit-DB</span><span class="badge mono" style="color:#EF4444;background:color-mix(in srgb,#EF4444 12%,transparent);border:1px solid color-mix(in srgb,#EF4444 28%,transparent);font-size:11px"><span style="width:6px;height:6px;border-radius:2px;background:#EF4444"></span>Metasploit</span>
</div>
<div class="row" style="gap:16px">
<span class="badge" style="color:#EF4444;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);font-size:11px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>KEV</span>
<div class="row" style="gap:8px"><div style="width:44px;height:6px;border-radius:99px;background:var(--bg2);overflow:hidden"><div style="width:94%;height:100%;background:#EF4444"></div></div><span class="mono" style="font-size:12px;color:var(--fg2)">EPSS 94%</span></div>
<span class="mono badge" style="color:#EF4444;background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.28);font-weight:600">10.0</span>
<span class="mono badge" style="color:#F97316;background:rgba(249,115,22,.13);border:1px solid rgba(249,115,22,.28);font-weight:600">7.5</span>
</div></body></html>
