{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kangalis.fullname" . }}-mcp
  labels:
    {{- include "kangalis.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: 8001
      name: mcp
  selector:
    {{- include "kangalis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kangalis.fullname" . }}-mcp
  labels:
    {{- include "kangalis.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kangalis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "kangalis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: {{ include "kangalis.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ include "kangalis.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until python -c "import socket; socket.create_connection(('{{ include "kangalis.postgresHost" . }}', 5432), 2)" 2>/dev/null; do echo 'db bekleniyor'; sleep 2; done
      {{- end }}
      containers:
        - name: mcp
          image: {{ include "kangalis.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "cybersectool.mcp.server"]
          envFrom:
            - configMapRef:
                name: {{ include "kangalis.fullname" . }}-config
            - secretRef:
                name: {{ include "kangalis.fullname" . }}-secret
          ports:
            - containerPort: 8001
              name: mcp
          {{- with .Values.mcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
